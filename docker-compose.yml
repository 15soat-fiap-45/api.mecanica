# Ambiente completo: PostgreSQL + MailHog (de infra/postgres) + migrações + API.
# Uso: docker compose up -d --build   (requer infra/postgres/.env)
include:
    - path: infra/postgres/docker-compose.yml
      env_file: infra/postgres/.env

x-api-env: &api-env
    env_file: infra/postgres/.env
    environment:
        DATABASE_URL: ''
        POSTGRES_HOST: postgres
        POSTGRES_PORT: '5432'
        SMTP_HOST: mailhog
        SMTP_PORT: '1025'

services:
    migrate:
        build: .
        image: api-oficina:local
        <<: *api-env
        command: ['node', 'dist/infra/database/migrate.js']
        restart: 'no'
        depends_on:
            postgres:
                condition: service_healthy

    api:
        image: api-oficina:local
        <<: *api-env
        ports:
            - '${API_PORT:-3000}:3000'
        restart: unless-stopped
        depends_on:
            migrate:
                condition: service_completed_successfully
            mailhog:
                condition: service_started
