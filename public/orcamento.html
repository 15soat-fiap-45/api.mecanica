<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Oficina Mecânica - Aprovação de Orçamento</title>
        <style>
            :root {
                --primary: #2563eb;
                --primary-hover: #1d4ed8;
                --success: #16a34a;
                --success-hover: #15803d;
                --danger: #dc2626;
                --danger-hover: #b91c1c;
                --bg: #f8fafc;
                --card-bg: #ffffff;
                --text-main: #0f172a;
                --text-muted: #64748b;
                --border: #e2e8f0;
                --radius: 12px;
                --shadow:
                    0 10px 25px -5px rgba(0, 0, 0, 0.05),
                    0 8px 10px -6px rgba(0, 0, 0, 0.03);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                    Oxygen, Ubuntu, Cantarell, sans-serif;
            }

            body {
                background-color: var(--bg);
                color: var(--text-main);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 1.5rem;
            }

            .container {
                width: 100%;
                max-width: 540px;
                background: var(--card-bg);
                border-radius: var(--radius);
                box-shadow: var(--shadow);
                border: 1px solid var(--border);
                overflow: hidden;
            }

            .header {
                background: #0f172a;
                color: #ffffff;
                padding: 2rem 1.5rem;
                text-align: center;
            }

            .header .logo {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 48px;
                height: 48px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 50%;
                margin-bottom: 0.75rem;
            }

            .header h1 {
                font-size: 1.35rem;
                font-weight: 700;
                letter-spacing: -0.02em;
            }

            .header p {
                font-size: 0.9rem;
                color: #94a3b8;
                margin-top: 0.25rem;
            }

            .content {
                padding: 2rem 1.75rem;
            }

            .instruction {
                font-size: 0.95rem;
                color: var(--text-muted);
                margin-bottom: 1.5rem;
                line-height: 1.5;
            }

            .field-group {
                margin-bottom: 1.5rem;
            }

            label {
                display: block;
                font-size: 0.875rem;
                font-weight: 600;
                color: var(--text-main);
                margin-bottom: 0.5rem;
            }

            .input-control {
                width: 100%;
                padding: 0.75rem 1rem;
                font-size: 0.95rem;
                border: 1px solid var(--border);
                border-radius: 8px;
                outline: none;
                transition: border-color 0.15s ease;
                background: #ffffff;
            }

            .input-control:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            }

            .decision-selector {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
                margin-bottom: 1.5rem;
            }

            .decision-card {
                border: 2px solid var(--border);
                border-radius: 8px;
                padding: 1rem;
                text-align: center;
                cursor: pointer;
                transition: all 0.2s ease;
                user-select: none;
                background: #ffffff;
            }

            .decision-card:hover {
                border-color: #cbd5e1;
            }

            .decision-card.selected-approved {
                border-color: var(--success);
                background-color: #f0fdf4;
            }

            .decision-card.selected-approved .decision-title {
                color: var(--success);
            }

            .decision-card.selected-rejected {
                border-color: var(--danger);
                background-color: #fef2f2;
            }

            .decision-card.selected-rejected .decision-title {
                color: var(--danger);
            }

            .decision-title {
                font-weight: 600;
                font-size: 1rem;
                margin-bottom: 0.25rem;
            }

            .decision-desc {
                font-size: 0.8rem;
                color: var(--text-muted);
            }

            textarea.input-control {
                resize: vertical;
                min-height: 90px;
            }

            .btn {
                width: 100%;
                padding: 0.875rem 1.5rem;
                border: none;
                border-radius: 8px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s ease;
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 0.5rem;
            }

            .btn-approve {
                background-color: var(--success);
                color: #ffffff;
            }

            .btn-approve:hover {
                background-color: var(--success-hover);
            }

            .btn-reject {
                background-color: var(--danger);
                color: #ffffff;
            }

            .btn-reject:hover {
                background-color: var(--danger-hover);
            }

            .btn:disabled {
                opacity: 0.6;
                cursor: not-allowed;
            }

            .status-box {
                display: none;
                padding: 1.5rem;
                border-radius: 8px;
                text-align: center;
            }

            .status-box.show {
                display: block;
            }

            .status-icon {
                width: 48px;
                height: 48px;
                margin: 0 auto 1rem;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .status-box.success {
                background-color: #f0fdf4;
                border: 1px solid #bbf7d0;
                color: #166534;
            }

            .status-box.success .status-icon {
                background-color: #dcfce7;
                color: var(--success);
            }

            .status-box.warning {
                background-color: #fffbeb;
                border: 1px solid #fef3c7;
                color: #92400e;
            }

            .status-box.warning .status-icon {
                background-color: #fef3c7;
                color: #b45309;
            }

            .status-box.error {
                background-color: #fef2f2;
                border: 1px solid #fecaca;
                color: #991b1b;
            }

            .status-box.error .status-icon {
                background-color: #fee2e2;
                color: var(--danger);
            }

            .status-title {
                font-size: 1.15rem;
                font-weight: 700;
                margin-bottom: 0.5rem;
            }

            .status-message {
                font-size: 0.925rem;
                line-height: 1.5;
            }

            .footer {
                text-align: center;
                margin-top: 1.5rem;
                font-size: 0.8rem;
                color: var(--text-muted);
            }

            .hidden {
                display: none !important;
            }

            .spinner {
                width: 20px;
                height: 20px;
                border: 2px solid rgba(255, 255, 255, 0.4);
                border-top-color: #ffffff;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <div class="logo">
                    <svg
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path
                            d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
                        />
                    </svg>
                </div>
                <h1>Oficina Mecânica</h1>
                <p>Decisão do Orçamento de Ordem de Serviço</p>
            </div>

            <div class="content">
                <div id="formSection">
                    <p class="instruction">
                        Confirme abaixo sua decisão sobre a proposta de
                        orçamento da sua Ordem de Serviço enviada por e-mail.
                    </p>

                    <form id="approvalForm" novalidate>
                        <div class="field-group" id="tokenFieldGroup">
                            <label for="tokenInput">Token de Aprovação</label>
                            <input
                                type="text"
                                id="tokenInput"
                                class="input-control"
                                placeholder="Token recebido no link do e-mail"
                                required
                            />
                        </div>

                        <div class="field-group">
                            <label>Sua Decisão</label>
                            <div class="decision-selector">
                                <div
                                    class="decision-card selected-approved"
                                    id="cardApprove"
                                    data-decision="approved"
                                >
                                    <div class="decision-title">Aprovar</div>
                                    <div class="decision-desc">
                                        Autorizar serviços e peças
                                    </div>
                                </div>
                                <div
                                    class="decision-card"
                                    id="cardReject"
                                    data-decision="rejected"
                                >
                                    <div class="decision-title">Recusar</div>
                                    <div class="decision-desc">
                                        Não autorizar orçamento
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div
                            class="field-group hidden"
                            id="rejectionReasonGroup"
                        >
                            <label for="rejectionReason"
                                >Motivo da Recusa (opcional)</label
                            >
                            <textarea
                                id="rejectionReason"
                                class="input-control"
                                maxlength="1000"
                                placeholder="Descreva brevemente o motivo da recusa..."
                            ></textarea>
                        </div>

                        <button
                            type="submit"
                            id="submitBtn"
                            class="btn btn-approve"
                        >
                            <span id="btnText">Confirmar Aprovação</span>
                        </button>
                    </form>
                </div>

                <div id="statusBox" class="status-box">
                    <div id="statusIcon" class="status-icon"></div>
                    <div id="statusTitle" class="status-title"></div>
                    <div id="statusMessage" class="status-message"></div>
                </div>
            </div>
        </div>

        <div class="footer">
            &copy; Oficina Mecânica — Confirmação segura de ordens de serviço.
        </div>

        <script>
            (function () {
                var form = document.getElementById('approvalForm');
                var tokenInput = document.getElementById('tokenInput');
                var tokenGroup = document.getElementById('tokenFieldGroup');
                var cardApprove = document.getElementById('cardApprove');
                var cardReject = document.getElementById('cardReject');
                var rejectionGroup = document.getElementById(
                    'rejectionReasonGroup',
                );
                var rejectionReason =
                    document.getElementById('rejectionReason');
                var submitBtn = document.getElementById('submitBtn');
                var btnText = document.getElementById('btnText');
                var formSection = document.getElementById('formSection');
                var statusBox = document.getElementById('statusBox');
                var statusIcon = document.getElementById('statusIcon');
                var statusTitle = document.getElementById('statusTitle');
                var statusMessage = document.getElementById('statusMessage');

                var selectedDecision = 'approved';

                function parseUrlData() {
                    var pathname = window.location.pathname || '';
                    var search = new URLSearchParams(window.location.search);

                    // Extract token from path: /orcamento/:token
                    var pathMatch = pathname.match(
                        /\/orcamento\/([A-Za-z0-9_-]{43})/,
                    );
                    var token = pathMatch
                        ? pathMatch[1]
                        : search.get('token') || '';

                    if (token) {
                        tokenInput.value = token;
                        // If token is already present in the path, hide manual input field for cleaner UI
                        tokenGroup.classList.add('hidden');
                    }

                    // Extract action (?acao=aprovar or ?acao=recusar)
                    var acao = (
                        search.get('acao') ||
                        search.get('action') ||
                        search.get('decision') ||
                        ''
                    ).toLowerCase();
                    if (
                        acao === 'recusar' ||
                        acao === 'rejeitar' ||
                        acao === 'rejected'
                    ) {
                        setDecision('rejected');
                    } else {
                        setDecision('approved');
                    }
                }

                function setDecision(decision) {
                    selectedDecision = decision;
                    if (decision === 'approved') {
                        cardApprove.classList.add('selected-approved');
                        cardReject.classList.remove('selected-rejected');
                        rejectionGroup.classList.add('hidden');
                        submitBtn.className = 'btn btn-approve';
                        btnText.textContent = 'Confirmar Aprovação';
                    } else {
                        cardReject.classList.add('selected-rejected');
                        cardApprove.classList.remove('selected-approved');
                        rejectionGroup.classList.remove('hidden');
                        submitBtn.className = 'btn btn-reject';
                        btnText.textContent = 'Confirmar Recusa';
                    }
                }

                cardApprove.addEventListener('click', function () {
                    setDecision('approved');
                });

                cardReject.addEventListener('click', function () {
                    setDecision('rejected');
                });

                function showStatus(type, title, message) {
                    formSection.classList.add('hidden');
                    statusBox.className = 'status-box show ' + type;
                    statusTitle.textContent = title;
                    statusMessage.textContent = message;

                    if (type === 'success') {
                        statusIcon.innerHTML =
                            '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
                    } else if (type === 'warning') {
                        statusIcon.innerHTML =
                            '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
                    } else {
                        statusIcon.innerHTML =
                            '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
                    }
                }

                form.addEventListener('submit', async function (e) {
                    e.preventDefault();

                    var token = tokenInput.value.trim();
                    if (!/^[A-Za-z0-9_-]{43}$/.test(token)) {
                        tokenGroup.classList.remove('hidden');
                        alert(
                            'Por favor, insira um token de aprovação válido (43 caracteres).',
                        );
                        tokenInput.focus();
                        return;
                    }

                    var payload = {
                        token: token,
                        decision: selectedDecision,
                    };

                    if (
                        selectedDecision === 'rejected' &&
                        rejectionReason.value.trim()
                    ) {
                        payload.rejectionReason = rejectionReason.value.trim();
                    }

                    submitBtn.disabled = true;
                    var originalBtnContent = btnText.textContent;
                    btnText.innerHTML =
                        '<span class="spinner"></span> Enviando...';

                    try {
                        var baseUrl = window.location.origin.startsWith('http')
                            ? window.location.origin
                            : 'http://localhost:3000';
                        var response = await fetch(
                            baseUrl + '/budget-approvals/decide',
                            {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                },
                                body: JSON.stringify(payload),
                            },
                        );

                        var data = {};
                        try {
                            data = await response.json();
                        } catch (jsonErr) {}

                        if (response.ok) {
                            if (data.status === 'already_decided') {
                                var pastDecision =
                                    data.decision === 'approved'
                                        ? 'aprovado'
                                        : 'recusado';
                                showStatus(
                                    'warning',
                                    'Decisão Já Registrada',
                                    'Este orçamento já havia sido respondido como ' +
                                        pastDecision +
                                        '. Sua decisão anterior permanece mantida.',
                                );
                            } else {
                                if (selectedDecision === 'approved') {
                                    showStatus(
                                        'success',
                                        'Orçamento Aprovado!',
                                        'Obrigado! Sua aprovação foi registrada com sucesso. A oficina já foi notificada e dará início aos serviços do seu veículo.',
                                    );
                                } else {
                                    showStatus(
                                        'warning',
                                        'Orçamento Recusado',
                                        'Sua recusa foi registrada com sucesso. A oficina mecânica foi informada e entrará em contato caso necessário.',
                                    );
                                }
                            }
                        } else {
                            var errMsg = data.message || 'Erro desconhecido.';
                            if (
                                errMsg.indexOf('Invalid or expired') !== -1 ||
                                response.status === 400 ||
                                response.status === 404
                            ) {
                                showStatus(
                                    'error',
                                    'Link Inválido ou Expirado',
                                    'Este link de aprovação não é mais válido ou já expirou. Por favor, entre em contato com a oficina para obter um novo orçamento.',
                                );
                            } else if (errMsg.indexOf('changed') !== -1) {
                                showStatus(
                                    'error',
                                    'Orçamento Atualizado',
                                    'O orçamento sofreu alterações após o envio deste link. Solicite à oficina o reenvio do link atualizado.',
                                );
                            } else {
                                showStatus(
                                    'error',
                                    'Não Foi Possível Registrar',
                                    errMsg,
                                );
                            }
                        }
                    } catch (err) {
                        showStatus(
                            'error',
                            'Erro de Conexão',
                            'Não foi possível conectar ao servidor da oficina. Verifique sua conexão e tente novamente.',
                        );
                    } finally {
                        submitBtn.disabled = false;
                        btnText.textContent = originalBtnContent;
                    }
                });

                parseUrlData();
            })();
        </script>
    </body>
</html>
